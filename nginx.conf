server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 单页应用（SPA）关键配置：
    # 用户刷新 /user/123 这类路由时，磁盘上并没有这个文件，
    # 必须回退到 index.html，交给前端路由（vue-router）接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源带 hash，可以放心让浏览器长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
